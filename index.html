<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f1ec; --ink:#1b2430; --muted:#5c6673; --line:#d9d5cb;
  --good:#1f8a5b; --good-bg:#e1f1e8; --bad:#c23b4e; --bad-bg:#f8e3e6; --hl:#f0c44c;
  --card:#fbfaf7;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#14191f; --ink:#ecebe6; --muted:#98a1ac; --line:#2c343d; --card:#1b222a;
    --good:#4cc38a; --good-bg:#17332a; --bad:#ff7a8b; --bad-bg:#3a1f25;}
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:"Newsreader","Cairo",Georgia,serif;font-size:18px;line-height:1.55;background:transparent;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.video-backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--paper)}
.video-backdrop video{width:100%;height:100%;object-fit:cover;display:block}
.video-backdrop::after{content:"";position:absolute;inset:0;background:var(--paper);opacity:.78}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:48px 20px 80px}
h1,h2,button,.tag{font-family:"Bricolage Grotesque","Cairo",system-ui,sans-serif}
h1{font-size:clamp(2.2rem,6vw,3.4rem);line-height:1;margin:0 0 12px;letter-spacing:-.02em;font-weight:800}
h1 mark{background:var(--hl);color:#1b2430;padding:0 .15em}
.lead{color:var(--muted);margin:0 0 28px;max-width:52ch}
.row{display:flex;gap:10px;flex-wrap:wrap}
input,select{font:inherit;padding:14px 16px;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px}
input[type=url]{flex:1 1 280px;min-width:0}
button{font-weight:700;font-size:1rem;padding:14px 22px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink)}
.source-tabs{display:flex;gap:8px;margin:0 0 12px}
button.source-tab{padding:9px 14px;background:var(--card);color:var(--muted);border:1px solid var(--line);font-size:.95rem}
button.source-tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.upload-drop{display:flex;min-height:132px;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:18px;border:2px dashed var(--muted);border-radius:12px;background:var(--card);text-align:center;cursor:pointer}
.upload-drop:hover,.upload-drop.dragging{border-color:var(--ink);background:var(--paper)}
.upload-drop strong{font-family:"Bricolage Grotesque","Cairo",system-ui,sans-serif}
.upload-drop span,.upload-help,.file-item{color:var(--muted);font-size:.9rem}
.file-input{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;clip-path:inset(50%)}
.file-list{display:grid;gap:6px;margin-top:10px}
.file-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow-wrap:anywhere}
.file-item span{min-width:0}
.file-clear{padding:5px 9px;font-size:.85rem;flex:none}
.upload-help{margin:8px 0 0}
.upload-error{color:var(--bad);font-size:.9rem;font-weight:600;margin:8px 0 0}
.or-divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;margin:10px 0}
.or-divider::before,.or-divider::after{content:"";height:1px;background:var(--line);flex:1}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.err{color:var(--bad);margin-top:14px;font-weight:600}
.hidden{display:none}
.bar{height:6px;background:var(--line);border-radius:3px;margin:0 0 28px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .35s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-family:"Bricolage Grotesque",sans-serif;font-size:.9rem;margin-bottom:8px}
h2{font-size:1.5rem;line-height:1.25;margin:0 0 22px;font-weight:700}
.opt{display:block;width:100%;text-align:start;margin:0 0 10px;padding:14px 16px;background:var(--card);color:var(--ink);
  border:2px solid var(--line);font-family:"Newsreader","Cairo",serif;font-weight:400;font-size:1.05rem;border-radius:10px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);opacity:1;text-decoration:line-through;text-decoration-thickness:1px}
.opt.right{border-color:var(--good);background:var(--good-bg);opacity:1}
.opt:disabled{cursor:default;opacity:1}
.note{margin:18px 0;padding:16px 18px;border-inline-start:5px solid var(--bad);background:var(--bad-bg);border-radius:10px}
.note.ok{border-inline-start-color:var(--good);background:var(--good-bg)}
.note b{font-family:"Bricolage Grotesque",sans-serif}
.note a{color:inherit;font-weight:600}
.summary{background:var(--card);border:1px solid var(--line);padding:16px 18px;border-radius:10px;margin:0 0 28px}
.big{font-family:"Bricolage Grotesque",sans-serif;font-size:4rem;font-weight:800;line-height:1}
.spin{display:inline-block;width:14px;height:14px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.bar i{transition:none}}
@media (prefers-reduced-motion:reduce){.video-backdrop video{display:none}}
</style>
</head>
<body>
<div class="video-backdrop" aria-hidden="true">
  <video autoplay muted loop playsinline preload="metadata">
    <source src="/background.mp4" type="video/mp4">
  </video>
</div>
<main>

<section id="home">
  <h1>Watch it. Then <mark>prove</mark> you got it.</h1>
  <p class="lead">Use a YouTube lesson or upload study material. The AI makes a quiz from it. Wrong answers are explained, and you can't move on until you get the question right.</p>
  <div class="source-tabs" role="group" aria-label="Choose quiz source">
    <button id="youtube-tab" class="source-tab" type="button" aria-pressed="true">YouTube link</button>
    <button id="upload-tab" class="source-tab" type="button" aria-pressed="false">Files or photos</button>
  </div>
  <div id="youtube-source">
  <div class="row">
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." aria-label="YouTube link">
  </div>
  </div>
  <div id="upload-source" class="hidden">
    <label class="upload-drop" id="dropzone" for="files">
      <input id="files" class="file-input" type="file" multiple accept=".pdf,.txt,.jpg,.jpeg,.png,.webp,.heic,.heif,application/pdf,text/plain,image/jpeg,image/png,image/webp,image/heic,image/heif">
      <strong>Choose files or photos</strong>
      <span>or drag them here</span>
    </label>
    <p class="upload-help">JPG, PNG, WEBP, HEIC, PDF, or TXT · up to 5 files · 2.5 MB total · TXT up to 250 KB</p>
    <div id="file-list" class="file-list" aria-live="polite"></div>
    <p id="upload-error" class="upload-error hidden" role="alert"></p>
  </div>
  <div class="or-divider"><span>Quiz size</span></div>
  <div class="row">
    <select id="count" aria-label="Number of questions">
      <option value="5">5 questions</option>
      <option value="8" selected>8 questions</option>
      <option value="12">12 questions</option>
    </select>
    <button id="go">Make quiz</button>
  </div>
  <div id="err" class="err hidden" role="alert"></div>
</section>

<section id="quiz" class="hidden">
  <div class="meta"><span id="round"></span><span id="count-label"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <h2 id="q" dir="auto"></h2>
  <div id="opts"></div>
  <div id="note" class="note hidden" aria-live="polite" dir="auto"></div>
  <button id="next" class="hidden">Next question</button>
</section>

<section id="done" class="hidden">
  <div class="big" id="score"></div>
  <p id="verdict" class="lead"></p>
  <div class="summary" id="sum" dir="auto"></div>
  <div class="row">
    <button id="again">Quiz another video</button>
  </div>
</section>

</main>

<script>
const $ = (id) => document.getElementById(id);
let quiz, videoUrl, queue, idx, missed, firstTry, total, roundNo, current, order;
let sourceMode = "youtube";
let selectedFiles = [];
const MAX_UPLOAD_BYTES = 2.5 * 1024 * 1024;
const FILE_TYPES = {
  "image/jpeg": [".jpg", ".jpeg"],
  "image/png": [".png"],
  "image/webp": [".webp"],
  "image/heic": [".heic"],
  "image/heif": [".heif"],
  "application/pdf": [".pdf"],
  "text/plain": [".txt"],
};

const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const show = (id) => ["home", "quiz", "done"].forEach((x) => $(x).classList.toggle("hidden", x !== id));

function setSourceMode(mode) {
  sourceMode = mode;
  const youtube = mode === "youtube";
  $("youtube-tab").setAttribute("aria-pressed", String(youtube));
  $("upload-tab").setAttribute("aria-pressed", String(!youtube));
  $("youtube-source").classList.toggle("hidden", !youtube);
  $("upload-source").classList.toggle("hidden", youtube);
  $("err").classList.add("hidden");
}

function mimeFor(file) {
  if (Object.hasOwn(FILE_TYPES, file.type)) return file.type;
  const name = file.name.toLowerCase();
  return Object.entries(FILE_TYPES).find(([, exts]) => exts.some((ext) => name.endsWith(ext)))?.[0] || "";
}

function setFiles(fileList) {
  const files = Array.from(fileList || []);
  const error = $("upload-error");
  error.classList.add("hidden");
  if (files.length > 5) {
    selectedFiles = [];
    error.textContent = "Choose no more than 5 files.";
    error.classList.remove("hidden");
  } else if (files.some((file) => !mimeFor(file))) {
    selectedFiles = [];
    error.textContent = "Use JPG, PNG, WEBP, HEIC, PDF, or TXT files.";
    error.classList.remove("hidden");
  } else if (files.reduce((sum, file) => sum + file.size, 0) > MAX_UPLOAD_BYTES) {
    selectedFiles = [];
    error.textContent = "These files are over the 2.5 MB total limit. Choose smaller files.";
    error.classList.remove("hidden");
  } else {
    selectedFiles = files;
  }
  renderFiles();
}

function renderFiles() {
  const list = $("file-list");
  list.replaceChildren();
  selectedFiles.forEach((file) => {
    const row = document.createElement("div");
    row.className = "file-item";
    const name = document.createElement("span");
    name.textContent = `${file.name} · ${(file.size / 1024).toFixed(0)} KB`;
    row.appendChild(name);
    list.appendChild(row);
  });
  if (selectedFiles.length) {
    const clear = document.createElement("button");
    clear.type = "button";
    clear.className = "ghost file-clear";
    clear.textContent = "Clear files";
    clear.onclick = () => { selectedFiles = []; $("files").value = ""; renderFiles(); };
    list.appendChild(clear);
  }
}

async function encodeFile(file) {
  const mimeType = mimeFor(file);
  if (mimeType === "text/plain") {
    return { name: file.name, mimeType, text: await file.text() };
  }
  const data = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error(`Couldn't read ${file.name}. Try selecting it again.`));
    reader.onload = () => resolve(String(reader.result).split(",", 2)[1] || "");
    reader.readAsDataURL(file);
  });
  return { name: file.name, mimeType, data };
}

$("youtube-tab").onclick = () => setSourceMode("youtube");
$("upload-tab").onclick = () => setSourceMode("upload");
$("files").onchange = (event) => setFiles(event.target.files);
$("dropzone").ondragover = (event) => { event.preventDefault(); $("dropzone").classList.add("dragging"); };
$("dropzone").ondragleave = () => $("dropzone").classList.remove("dragging");
$("dropzone").ondrop = (event) => {
  event.preventDefault();
  $("dropzone").classList.remove("dragging");
  setFiles(event.dataTransfer.files);
};

$("go").onclick = async () => {
  const url = sourceMode === "youtube" ? $("url").value.trim() : "";
  $("err").classList.add("hidden");
  $("upload-error").classList.add("hidden");
  if (sourceMode === "youtube" && !url) {
    $("err").textContent = "Paste a YouTube link first.";
    $("err").classList.remove("hidden");
    return;
  }
  if (sourceMode === "upload" && !selectedFiles.length) {
    $("upload-error").textContent = "Choose at least one file or photo first.";
    $("upload-error").classList.remove("hidden");
    return;
  }
  $("go").disabled = true;
  $("go").innerHTML = sourceMode === "youtube"
    ? '<span class="spin"></span>Watching the video...'
    : '<span class="spin"></span>Reading your files...';
  try {
    const files = sourceMode === "upload" ? await Promise.all(selectedFiles.map(encodeFile)) : [];
    const body = JSON.stringify({ url, files, count: $(\"count\").value });
    if (new Blob([body]).size > 4 * 1024 * 1024) throw new Error("This upload is too large to send. Choose smaller files.");
    const r = await fetch("/api/quiz", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body,
    });
    const raw = await r.text();
    let data;
    try { data = JSON.parse(raw); } catch {
      throw new Error("The backend is not running here (got a web page instead of quiz data). Open the deployed Vercel link, or run with 'vercel dev'. Status: " + r.status);
    }
    if (!r.ok && r.status !== 202) throw new Error(data.error || "Something went wrong");

    if (r.status === 202 && data.interactionId) {
      const interactionId = data.interactionId;
      const count = $("count").value;
      const deadline = Date.now() + 30 * 60 * 1000;
      let pollNumber = 0;
      while (Date.now() < deadline) {
        await new Promise((resolve) => setTimeout(resolve, 4000));
        pollNumber++;
        $("go").innerHTML = pollNumber % 3 === 0
          ? '<span class="spin"></span>Checking the full lesson...'
          : '<span class="spin"></span>Gemini is studying the video...';
        const statusResponse = await fetch(`/api/quiz?id=${encodeURIComponent(interactionId)}&count=${encodeURIComponent(count)}`, {
          method: "GET",
          cache: "no-store",
        });
        const statusRaw = await statusResponse.text();
        let statusData;
        try { statusData = JSON.parse(statusRaw); } catch {
          throw new Error("Couldn't read the video-processing status. Please try again.");
        }
        if (statusResponse.status === 202) continue;
        if (statusResponse.status === 429 || statusResponse.status === 503) continue;
        if (!statusResponse.ok) throw new Error(statusData.error || "Video analysis failed. Please try again.");
        data = statusData;
        break;
      }
      if (Date.now() >= deadline) throw new Error("This lesson is taking longer than expected. Please try again; the video may still be processing.");
      if (!Array.isArray(data.questions)) throw new Error("Gemini finished but did not return a quiz. Please try again.");
    }

    quiz = data; videoUrl = url || null; start();
  } catch (e) {
    $("err").textContent = e.message;
    $("err").classList.remove("hidden");
  } finally {
    $("go").disabled = false;
    $("go").textContent = "Make quiz";
  }
};

function start() {
  total = quiz.questions.length;
  firstTry = 0; roundNo = 1;
  runRound(quiz.questions.map((q, i) => ({ ...q, id: i })), false);
}

function runRound(list, isReview) {
  queue = list; idx = 0; missed = [];
  $("round").textContent = isReview ? "Review round: the ones you missed" : "Round 1";
  show("quiz");
  ask();
}

function ask() {
  current = queue[idx];
  order = shuffle([0, 1, 2, 3]);   // options reshuffled every time
  current.slipped = false;
  $("q").textContent = current.question;
  $("count-label").textContent = `Question ${idx + 1} of ${queue.length}`;
  $("prog").style.width = (idx / queue.length) * 100 + "%";
  $("note").classList.add("hidden");
  $("next").classList.add("hidden");
  const box = $("opts"); box.innerHTML = "";
  order.forEach((orig) => {
    const b = document.createElement("button");
    b.className = "opt"; b.dir = "auto"; b.textContent = current.options[orig]; b.dataset.o = orig;
    b.onclick = () => pick(b, orig);
    box.appendChild(b);
  });
}

function link(q) {
  if (!videoUrl) return null;
  const target = new URL(videoUrl);
  target.searchParams.set("t", `${Math.floor(q.seconds || 0)}s`);
  const anchor = document.createElement("a");
  anchor.href = target.toString();
  anchor.target = "_blank";
  anchor.rel = "noopener";
  anchor.textContent = `Rewatch at ${fmt(q.seconds || 0)}`;
  return anchor;
}

function pick(btn, orig) {
  const note = $("note");
  if (orig === current.answerIndex) {
    btn.classList.add("right");
    [...$("opts").children].forEach((b) => (b.disabled = true));
    if (!current.slipped && !current.isRetry) firstTry++;
    if (current.slipped && !missed.includes(current)) missed.push(current);
    note.className = "note ok";
    note.replaceChildren();
    const label = document.createElement("b"); label.textContent = "Correct.";
    note.append(label, document.createTextNode(` ${current.explanations[orig] || ""} `));
    const rewatch = link(current); if (rewatch) note.appendChild(rewatch);
    $("next").textContent = idx + 1 < queue.length ? "Next question" : "Finish";
    $("next").classList.remove("hidden");
    $("next").focus();
  } else {
    current.slipped = true;
    btn.classList.add("wrong"); btn.disabled = true;
    note.className = "note";
    note.replaceChildren();
    const label = document.createElement("b"); label.textContent = "Not quite.";
    note.append(label, document.createTextNode(` ${current.explanations[orig] || ""} `));
    const retry = document.createElement("span"); retry.textContent = "Try again.";
    note.appendChild(retry);
    const rewatch = link(current); if (rewatch) { note.appendChild(document.createElement("br")); note.appendChild(rewatch); }
  }
  note.classList.remove("hidden");
}

$("next").onclick = () => {
  idx++;
  if (idx < queue.length) return ask();
  if (missed.length) {
    roundNo++;
    const retry = missed.map((q) => ({ ...q, isRetry: true }));
    return runRound(retry, true);
  }
  finish();
};

function finish() {
  $("prog").style.width = "100%";
  show("done");
  $("score").textContent = `${firstTry}/${total}`;
  $("verdict").textContent = firstTry === total
    ? "Perfect on the first try. You understood this video."
    : "You got every question right in the end, including the ones you missed. That is how it sticks.";
  const title = document.createElement("b"); title.textContent = quiz.title || "Study material";
  $("sum").replaceChildren(title, document.createElement("br"), document.createTextNode(quiz.summary || ""));
}

$("again").onclick = () => { $("url").value = ""; selectedFiles = []; $("files").value = ""; renderFiles(); show("home"); };
$("url").addEventListener("keydown", (e) => { if (sourceMode === "youtube" && e.key === "Enter") $("go").click(); });
</script>
</body>
</html>
